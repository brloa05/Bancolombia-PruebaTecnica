services:
  postgres:
    image: postgres:16-alpine
    container_name: analitica_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analitica_inversiones}
      POSTGRES_USER: ${POSTGRES_USER:-analitica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analitica}
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analitica} -d ${POSTGRES_DB:-analitica_inversiones}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
